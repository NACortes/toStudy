<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablas de multiplicar</title>
  <style>
    :root{--ink:#213036;--muted:#60747b;--teal:#197278;--coral:#d95d39;--line:#ded3bf;--blue:#2f6690}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:clamp(12px,3vw,28px);font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(145deg,#f8f1e4,#e8f4f2)}.app{width:min(850px,100%);margin:auto}.site-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:2px solid var(--line)}.brand{color:var(--teal);font-size:1.05rem;font-weight:900;text-decoration:none}.site-nav{display:flex;flex-wrap:wrap;gap:6px}.site-nav a{padding:8px 10px;border-radius:7px;color:var(--muted);font-size:.9rem;font-weight:900;text-decoration:none}.site-nav a:hover,.site-nav a.active{background:#e7f5f3;color:var(--teal)}.score{padding:10px 14px;border:2px solid var(--line);border-radius:8px;background:#fff;font-weight:900;color:var(--teal)}h1{margin:24px 0 6px;font-size:clamp(2rem,6vw,3.5rem);color:#12565b}.subtitle{margin:0 0 20px;color:var(--muted);font-weight:700}.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.pick label{display:grid;gap:6px;font-weight:900}.pick select{min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-weight:900;color:var(--ink)}.card{display:grid;place-items:center;min-height:330px;padding:24px;border:2px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 12px 28px rgba(33,48,54,.12);text-align:center}.operation{font-size:clamp(3.3rem,15vw,6rem);font-weight:900}.answer{display:inline-block;min-width:1.55em;border:4px solid var(--ink);border-radius:8px;color:transparent}.card.revealed .answer{border-color:var(--coral);background:#fff0eb;color:var(--coral)}.hint{margin:18px 0 0;color:var(--muted);font-weight:800}.answer-form{display:none;grid-template-columns:1fr auto;gap:8px;width:min(280px,100%);margin:18px auto 0}.answer-form.show{display:grid}.answer-form input{width:100%;min-height:50px;border:2px solid var(--line);border-radius:8px;text-align:center;font:inherit;font-weight:900}.answer-form button,.btn{min-height:50px;padding:0 16px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-weight:900;cursor:pointer}.answer-form button{background:var(--blue);border-color:var(--blue);color:#fff}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}.btn.main{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.45}.list{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}.mini{min-height:48px;border:2px solid #d7e4e2;border-radius:8px;background:#fff;color:var(--muted);font:inherit;font-weight:900;cursor:pointer}.mini.done{color:var(--teal);background:#effaf7;border-color:var(--teal)}.message{min-height:0;margin-top:12px;padding:0;color:var(--coral);font-weight:900;text-align:center}.message.show{min-height:28px;padding:7px;border-radius:8px;background:#fff0eb}.toast{position:fixed;left:50%;top:50%;z-index:20;width:min(330px,calc(100vw - 32px));padding:18px 16px;border:3px solid var(--teal);border-radius:10px;background:#effaf7;box-shadow:0 18px 44px rgba(33,48,54,.24);text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.94);transition:opacity .14s,transform .14s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast.error{border-color:var(--coral);background:#fff0eb}.toast-title{display:block;font-size:clamp(1.45rem,7vw,2rem);font-weight:900}.toast-detail{display:block;margin-top:8px;color:var(--muted);font-weight:800}
    @media(max-width:600px){.site-header{align-items:flex-start;flex-direction:column}.site-nav{width:100%;justify-content:space-between}.site-nav a{flex:1;text-align:center}.pick{grid-template-columns:1fr}.card{min-height:280px}.list{grid-template-columns:repeat(2,1fr)}.btn{flex:1 1 130px}}
  </style>
</head>
<body><main class="app"><header class="site-header"><a class="brand" href="index.html">Matemáticas</a><nav class="site-nav" aria-label="Navegación principal"><a href="study.html">Quintetas</a><a class="active" href="tablas.html">Tablas</a><a href="juego.html">Juego</a></nav><div class="score" id="score">0 / 10</div></header><h1>Tablas de multiplicar</h1><p class="subtitle">Elige una tabla y elige cómo quieres practicar.</p><div class="pick"><label for="tableSelect">Tabla<select id="tableSelect"></select></label><label for="modeSelect">Modo<select id="modeSelect"><option value="study">Estudiar</option><option value="eval">Evaluar</option></select></label></div><section class="card" id="card" role="button" tabindex="0"><div><div class="operation" id="operation"></div><p class="hint" id="hint">Toca para ver el resultado</p><form class="answer-form" id="answerForm"><input id="answerInput" type="number" inputmode="numeric" aria-label="Escribir resultado" autocomplete="off"><button type="submit">Revisar</button></form></div></section><div class="message" id="message" role="status" aria-live="polite"></div><div class="controls"><button class="btn" id="prev">Anterior</button><button class="btn main" id="next">Siguiente</button><button class="btn" id="reset">Reiniciar</button></div><div class="list" id="list"></div></main><div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-title" id="toastTitle"></span><span class="toast-detail" id="toastDetail"></span></div>
<script>
  const tables=Array.from({length:10},(_,i)=>Array.from({length:10},(__,j)=>({a:i+1,b:j+1,answer:(i+1)*(j+1)})));let table=0,index=0,revealed=false,solved=new Set(),mode='study',messageTimer=null;
  const select=document.querySelector('#tableSelect'),modeSelect=document.querySelector('#modeSelect'),card=document.querySelector('#card'),operation=document.querySelector('#operation'),hint=document.querySelector('#hint'),score=document.querySelector('#score'),list=document.querySelector('#list'),form=document.querySelector('#answerForm'),input=document.querySelector('#answerInput'),message=document.querySelector('#message');
  for(let i=0;i<10;i++){const option=document.createElement('option');option.value=i;option.textContent=`Tabla del ${i+1}`;select.appendChild(option)}
  function render(){const items=tables[table],item=items[index];operation.innerHTML=`${item.a} × ${item.b} = <span class="answer">${item.answer}</span>`;card.classList.toggle('revealed',revealed);form.classList.toggle('show',mode==='eval');hint.textContent=mode==='eval'?'Escribe el resultado':'Toca para ver el resultado';if(mode==='study'&&revealed)hint.textContent='Toca para pasar a la siguiente';score.textContent=`${solved.size} / 10`;list.innerHTML='';items.forEach((x,i)=>{const b=document.createElement('button');b.className=`mini${solved.has(i)?' done':''}`;b.textContent=revealed&&i===index?`${x.a} × ${x.b} = ${x.answer}`:`${x.a} × ${x.b}`;b.onclick=()=>{index=i;revealed=solved.has(i);input.value='';render()};list.appendChild(b)})}
  function next(){index=(index+1)%10;revealed=false;input.value='';clearMessage();render()} function toggle(){if(mode==='eval'){input.focus();return}if(revealed){next()}else{revealed=true;solved.add(index);render()}}
  const toast=document.querySelector('#toast'),toastTitle=document.querySelector('#toastTitle'),toastDetail=document.querySelector('#toastDetail');let toastTimer=null;
  function showMessage(text){message.textContent=text;message.className='message show';clearTimeout(messageTimer);messageTimer=setTimeout(clearMessage,1300)} function clearMessage(){message.textContent='';message.className='message'}
  function showToast(kind,title,detail){clearTimeout(toastTimer);toast.className=`toast ${kind} show`;toastTitle.textContent=title;toastDetail.textContent=detail;toastTimer=setTimeout(()=>toast.className='toast',kind==='success'?850:1250)}
  function evaluateAnswer(value){if(Number(value)===tables[table][index].answer){revealed=true;solved.add(index);render();showToast('success','¡Muy bien!','Respuesta correcta');setTimeout(next,850)}else{showMessage('Casi. ¡Sigue intentando!');showToast('error','Intenta nuevamente','Revisa tu respuesta y vuelve a intentarlo')}}
  select.onchange=()=>{table=Number(select.value);index=0;revealed=false;solved=new Set();input.value='';clearMessage();render()};modeSelect.onchange=()=>{mode=modeSelect.value;index=0;revealed=false;solved=new Set();input.value='';clearMessage();render();if(mode==='eval')input.focus()};card.onclick=toggle;form.onsubmit=e=>{e.preventDefault();if(input.value.trim()==='')showMessage('Escribe un resultado');else evaluateAnswer(input.value)};document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=()=>{index=(index+9)%10;revealed=false;input.value='';clearMessage();render()};document.querySelector('#reset').onclick=()=>{index=0;revealed=false;solved=new Set();input.value='';clearMessage();render()};document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){if(document.activeElement!==input){e.preventDefault();toggle()}}else if(e.key==='ArrowRight')next()});render();
</script></body></html>
