<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego de parejas</title>
  <style>
    :root{--ink:#213036;--muted:#60747b;--teal:#197278;--blue:#2f6690;--coral:#d95d39;--line:#ded3bf}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:clamp(12px,3vw,28px);font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(145deg,#f8f1e4,#e8f4f2)}.app{width:min(980px,100%);margin:auto}.site-nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 14px;border-bottom:2px solid var(--line);margin-bottom:14px}.site-nav a{flex:1;padding:8px 6px;border-radius:7px;color:var(--muted);font-size:.88rem;font-weight:900;text-align:center;text-decoration:none}.site-nav a:hover,.site-nav a.active{background:#e7f5f3;color:var(--teal)}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.back{color:var(--teal);font-weight:900;text-decoration:none}.score{padding:9px 13px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--teal);font-weight:900}h1{margin:22px 0 6px;font-size:clamp(2rem,6vw,3.5rem);color:#12565b}.subtitle{margin:0 0 18px;color:var(--muted);font-weight:700}.game{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,4vw,32px)}.column{padding:14px;border-radius:12px;background:rgba(255,255,255,.72);border:2px solid var(--line)}.column h2{margin:0 0 12px;text-align:center;font-size:1.1rem}.choices{display:grid;gap:10px}.tile{min-height:62px;padding:12px 10px;border:2px solid #d7e4e2;border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:clamp(1.05rem,3vw,1.35rem);font-weight:900;cursor:pointer}.tile:hover,.tile:focus-visible{border-color:var(--teal);outline:3px solid rgba(25,114,120,.15)}.tile.selected{background:#e7f5f3;border-color:var(--teal)}.tile.matched{background:#effaf7;border-color:var(--teal);color:var(--teal);cursor:default}.tile.wrong{background:#fff0eb;border-color:var(--coral);animation:shake .28s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.message{min-height:54px;display:grid;place-items:center;margin-top:16px;padding:10px;border-radius:8px;background:#fff;text-align:center;font-weight:900;color:var(--muted)}.actions{display:flex;justify-content:center;gap:10px;margin-top:16px}.btn{min-height:48px;padding:0 18px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-weight:900;cursor:pointer}.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}.toast{position:fixed;left:50%;top:50%;z-index:20;width:min(330px,calc(100vw - 32px));padding:18px 16px;border:3px solid var(--teal);border-radius:10px;background:#effaf7;box-shadow:0 18px 44px rgba(33,48,54,.24);text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.94);transition:opacity .14s,transform .14s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast.error{border-color:var(--coral);background:#fff0eb}.toast-title{display:block;font-size:clamp(1.45rem,7vw,2rem);font-weight:900}.toast-detail{display:block;margin-top:8px;color:var(--muted);font-weight:800}@media(max-width:650px){.site-nav a{font-size:.8rem}.game{grid-template-columns:1fr;gap:10px}.column{padding:10px}.column h2{margin-bottom:8px}.choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{min-height:56px;padding:8px 5px}.right-column{order:2}.left-column{order:1}.actions .btn{flex:1}}
  </style>
</head>
<body><main class="app"><nav class="site-nav" aria-label="Navegación principal"><a href="index.html">Inicio</a><a href="study.html">Quintetas</a><a href="tablas.html">Tablas</a><a class="active" href="juego.html">Juego</a></nav><div class="top"><a class="back" href="index.html">← Menú</a><div class="score" id="score">0 / 10</div></div><h1>Juego de parejas</h1><p class="subtitle">Elige una operación y luego el resultado que le corresponde.</p><section class="game"><div class="column left-column"><h2>Operaciones</h2><div class="choices" id="operations"></div></div><div class="column right-column"><h2>Resultados</h2><div class="choices" id="results"></div></div></section><div class="message" id="message" role="status" aria-live="polite">¡Tú puedes! Elige una operación.</div><div class="actions"><button class="btn main" id="newGame">Nueva ronda</button></div></main><div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-title" id="toastTitle"></span><span class="toast-detail" id="toastDetail"></span></div>
<script>
  const operationsEl=document.querySelector('#operations'),resultsEl=document.querySelector('#results'),messageEl=document.querySelector('#message'),scoreEl=document.querySelector('#score'),toast=document.querySelector('#toast'),toastTitle=document.querySelector('#toastTitle'),toastDetail=document.querySelector('#toastDetail');let pairs=[],selectedOperation=null,matched=0,locked=false,toastTimer=null;
  function shuffle(items){return [...items].sort(()=>Math.random()-.5)}
  function showToast(kind,title,detail){clearTimeout(toastTimer);toast.className=`toast ${kind} show`;toastTitle.textContent=title;toastDetail.textContent=detail;toastTimer=setTimeout(()=>toast.className='toast',kind==='success'?850:1250)}
  function newGame(){const pool=shuffle(Array.from({length:10},(_,i)=>{const a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8);return{id:i,a,b,answer:a*b}}));pairs=pool;selectedOperation=null;matched=0;locked=false;scoreEl.textContent='0 / 10';messageEl.textContent='¡Tú puedes! Elige una operación.';render()}
  function render(){operationsEl.innerHTML='';resultsEl.innerHTML='';pairs.forEach(pair=>{const b=document.createElement('button');b.className='tile';b.dataset.id=pair.id;b.textContent=`${pair.a} × ${pair.b}`;b.onclick=()=>chooseOperation(pair.id);operationsEl.appendChild(b)});shuffle(pairs).forEach(pair=>{const b=document.createElement('button');b.className='tile';b.dataset.id=pair.id;b.textContent=pair.answer;b.onclick=()=>chooseResult(pair.id);resultsEl.appendChild(b)})}
  function chooseOperation(id){if(locked||pairs.find(p=>p.id===id).matched)return;selectedOperation=id;document.querySelectorAll('#operations .tile').forEach(b=>b.classList.toggle('selected',Number(b.dataset.id)===id));messageEl.textContent='Ahora elige el resultado.'}
  function chooseResult(id){if(locked||selectedOperation===null)return;const operation=pairs.find(p=>p.id===selectedOperation);if(operation.id===id){locked=true;operation.matched=true;matched++;document.querySelectorAll(`[data-id="${id}"]`).forEach(b=>b.classList.add('matched'));scoreEl.textContent=`${matched} / 10`;messageEl.textContent=matched===10?'¡Excelente! ¡Completaste la ronda!':'¡Muy bien! ¡Encontraste la pareja!';showToast('success',matched===10?'¡Excelente!':'¡Muy bien!','Encontraste la pareja');setTimeout(()=>{selectedOperation=null;locked=false;document.querySelectorAll('#operations .tile').forEach(b=>b.classList.remove('selected'));if(matched<10)messageEl.textContent='Elige otra operación.'},650)}else{messageEl.textContent='Casi. ¡Sigue intentando!';showToast('error','Intenta nuevamente','Busca la pareja correcta');document.querySelectorAll(`#results .tile[data-id="${id}"]`).forEach(b=>{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),350)})}}
  document.querySelector('#newGame').onclick=newGame;newGame();
</script></body></html>
